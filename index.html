<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À Demi-Mot – Un mot, puis le reste.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e192c;--navy2:#16254a;--gold:#d9b36c;--gold2:#a98a4c;--ivory:#f6f0e2;--ink:#1f2433;--mute:#9aa3bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--navy);color:#e9e6dc;font:16px/1.55 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;color:var(--gold);line-height:1.12;margin:0 0 .5em}
h1{font-size:clamp(2.3rem,6vw,3.8rem)}h2{font-size:clamp(1.7rem,4vw,2.4rem)}h3{font-size:1.35rem}
p{margin:0 0 1em}
a{color:var(--gold)}
button,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid #26365e;position:sticky;top:0;z-index:5;background:rgba(14,25,44,.95);backdrop-filter:blur(6px);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:"Cormorant Garamond",serif;font-size:1.5rem;color:var(--gold);cursor:pointer;background:none;border:0;display:flex;gap:10px;align-items:center}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:999px;padding:13px 26px;font-weight:600;cursor:pointer;min-height:46px}
.btn:hover{background:#e6c488}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold2)}
.btn.ghost:hover{background:#16254a}
.btn.sm{padding:7px 16px;min-height:36px;font-size:.9rem}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:56px 0 40px}
.hero p.lead{font-size:1.15rem;color:#cfd3e2;max-width:46ch}
.hero .logo{width:min(100%,300px);border-radius:10px;margin-top:22px;opacity:.95}
.hero svg{width:100%;height:auto}
.moments{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:16px 0 40px}
.mom{background:var(--navy2);border:1px solid #26365e;border-radius:14px;padding:20px}
.mom .pic{height:130px;border-radius:8px;background:#0b1328;display:grid;place-items:center;margin-bottom:14px;overflow:hidden}
.mom small{color:var(--gold);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.05rem}
.offer{background:var(--ivory);color:var(--ink);border-radius:16px;padding:28px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;margin-bottom:56px}
.offer h2{color:#6b5320}.offer ul{padding-left:18px;margin:0}
.price{font-family:"Cormorant Garamond",serif;font-size:2.8rem;color:#6b5320;line-height:1}
.offer .btn{background:var(--navy);color:var(--gold)}
footer{border-top:1px solid #26365e;padding:24px 0;color:var(--mute);font-size:.9rem;text-align:center}
/* parcours */
.steps{display:flex;gap:6px;margin:26px 0 6px;list-style:none;padding:0}
.steps li{flex:1}
.steps button{width:100%;background:none;border:0;border-top:3px solid #2a3a63;padding:8px 2px 0;color:var(--mute);text-align:left;cursor:pointer;font-size:.88rem}
.steps li.done button{border-color:var(--gold2);color:#cfd3e2}
.steps li.cur button{border-color:var(--gold);color:var(--gold);font-weight:600}
.panel{padding:18px 0 40px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
.card{background:var(--navy2);border:1px solid #2a3a63;border-radius:14px;padding:22px;text-align:left;color:inherit;cursor:pointer}
.card:hover,.card.sel{border-color:var(--gold);background:#1b2d57}
.card b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.4rem;color:var(--gold);font-weight:600}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 18px}
label{display:block;font-size:.9rem;color:#cfd3e2;margin-bottom:4px}
input[type=text],input[type=url],textarea{width:100%;background:#f9f5ea;color:var(--ink);border:1px solid #cdbf9c;border-radius:8px;padding:11px 12px}
textarea{resize:vertical;min-height:100px;line-height:1.6}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.chat{background:var(--navy2);border:1px solid #2a3a63;border-radius:14px;padding:16px;display:flex;flex-direction:column;height:480px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.97rem}
.m.bot{background:#0e1830;border:1px solid #2a3a63;align-self:flex-start}
.m.me{background:var(--gold);color:var(--navy);align-self:flex-end}
.send{display:flex;gap:8px;margin-top:8px}
.paper{background:var(--ivory);color:var(--ink);border-radius:6px;padding:30px 28px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.2rem;line-height:1.7;white-space:pre-wrap;min-height:220px}
.paper.manuscrit{font-family:Caveat,"Segoe Script",cursive;font-size:1.5rem;line-height:1.5;background-image:repeating-linear-gradient(transparent 0 35px,#e2d6b8 35px 36px)}
.paper.illustre{border:1px solid #cdbf9c;outline:5px double #e5d9ba;outline-offset:-14px;padding-top:56px;position:relative}
.paper.illustre:before{content:"❦";position:absolute;top:14px;left:0;right:0;text-align:center;color:#a98a4c;font-size:1.6rem}
.hint{color:var(--mute);font-size:.85rem}
.tag{display:inline-block;background:#26365e;color:var(--gold);border-radius:999px;padding:2px 10px;font-size:.78rem;margin-bottom:8px}
.tag.warn{background:#4a3a1a}
.mus{background:var(--ivory);color:var(--ink);border-radius:8px;width:200px;padding:16px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.35);margin:0 auto}
.mus b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;color:#6b5320;display:block}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.sum{background:var(--navy2);border:1px solid #2a3a63;border-radius:14px;padding:18px;margin-bottom:16px}
.sum header{all:unset}
.sumh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:#cfd3e2}
.tot.big{font-size:1.25rem;color:var(--gold);border-top:1px solid #2a3a63;margin-top:6px;padding-top:10px}
.err{color:#f0b4a8;font-size:.9rem;min-height:1.3em}
.toggle{display:flex;gap:10px;align-items:center;margin:8px 0 12px}
.toggle input{width:20px;height:20px;accent-color:#d9b36c}
.mobonly{display:none}
@media(max-width:760px){
 .hero,.offer,.split,.choice{grid-template-columns:1fr}
 .moments,.opt,.row3{grid-template-columns:1fr}
 .hero{padding-top:28px}.hero .art{order:-1}
 .chat{height:400px}
 .mobonly{display:inline-flex}
 .steps button{font-size:.75rem}
 .paper{padding:24px 18px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.btn{border-radius:2px;letter-spacing:.06em;font-size:.9rem;padding:14px 30px}
.btn.sm{padding:8px 16px}
.card,.sum,.chat,.mom{border-radius:3px}
header .wrap{height:76px}
.brand img{height:58px;display:block}
.herobg{background:radial-gradient(ellipse at 85% 10%,#1d2e55 0,transparent 55%)}
.hero2{display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center;padding:90px 20px 80px}
.hero2 h1{font-size:clamp(2.7rem,6.2vw,4.7rem);letter-spacing:-.01em}
.hero2 .lead{font-size:1.2rem;color:#cfd3e2;max-width:44ch;margin-bottom:1.6em}
.stage{position:relative;height:440px}
.stage .paper{position:absolute;left:0;top:6px;width:80%;transform:rotate(-2.5deg);font-size:1.08rem;min-height:0;padding:36px 32px;box-shadow:0 24px 50px rgba(0,0,0,.5)}
.stage .mus{position:absolute;right:0;bottom:0;transform:rotate(4deg);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.mom2{border-top:1px solid var(--gold2);padding-top:14px}
.moments{counter-reset:m;gap:36px}
.mom2:before{counter-increment:m;content:counter(m,upper-roman);font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-size:1.7rem}
.hero2 .lead{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.55rem;line-height:1.4;color:#e4dcc8;max-width:30ch}
.stage .paper{transform:none;width:82%;padding:44px 38px;font-size:1.12rem;outline:1px solid rgba(217,179,108,.5);outline-offset:10px}
.stage .mus{transform:none}
.choice3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
.seg{display:flex;margin-bottom:10px}
.seg:before{content:"Longueur";align-self:center;margin-right:14px;font-size:.9rem;color:#cfd3e2}
.seg button{flex:1;background:none;border:1px solid #2a3a63;color:#cfd3e2;padding:8px;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
@media(max-width:760px){.choice3{grid-template-columns:1fr}.moments{gap:22px}}
@media(max-width:760px){.hero2{grid-template-columns:1fr;gap:30px;padding:36px 20px}.stage{height:460px}.stage .paper{width:90%}.brand img{height:50px}}
.heroimg{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.mom2{display:flex;flex-direction:column;border-top:0;padding-top:0}
.mom2 img{order:-1;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;margin-bottom:16px;display:block}
.offer{grid-template-columns:1fr 1.3fr .8fr;align-items:center;padding:20px 28px 20px 20px}
.offimg{width:100%;display:block;border-radius:3px}
@media(max-width:760px){.offer{grid-template-columns:1fr;padding:20px}}
.mcard{order:-1;aspect-ratio:1/1;background:#0e192c;border:1px solid #26365e;border-radius:3px;margin-bottom:16px;display:grid;place-items:center}
.mcard .mus{width:150px;padding:12px;transform:rotate(-3deg)}
.mcard .mus svg{width:84px;height:84px}
.vhero{position:relative;min-height:calc(100svh - 76px);display:flex;align-items:flex-end;overflow:hidden;background:#0e192c}
.vbg{position:absolute;inset:0;background-size:cover;background-position:center 62%;animation:kb 20s ease-in-out infinite alternate}
.vvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.vshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,25,44,.92) 0,rgba(14,25,44,.55) 45%,rgba(14,25,44,.08) 100%),linear-gradient(0deg,rgba(14,25,44,.65),transparent 40%)}
.vcontent{position:relative;padding-top:90px;padding-bottom:96px}
.vhero h1{color:#f3ead6;max-width:13ch;font-size:clamp(2.8rem,6.5vw,5rem)}
.vhero .lead{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.5rem;line-height:1.4;color:#eadfc6;max-width:34ch;margin-bottom:1.6em}
.vhero .btn{background:#d9b36c;color:#0e192c}
.vhint{color:#cfd3e2;font-size:.85rem;margin-top:14px}
@media(prefers-reduced-motion:reduce){.vbg{animation:none}}
@media(max-width:760px){.vhero{min-height:80svh}.vshade{background:linear-gradient(0deg,rgba(14,25,44,.93),rgba(14,25,44,.3))}.vcontent{padding-bottom:50px}}
.tgl{margin-right:10px}
</style>
<style id="v2">
/* ===== v2 : accueil ivoire, parcours bleu nuit ===== */
img,svg{max-width:100%}
header{background:#0e192c;border-bottom:0}
footer{background:#0e192c;border:0;padding:44px 0 36px;margin-top:40px}
/* parcours */
input[type=email],input[type=date],input[type=tel],select{width:100%;background:#f9f5ea;color:var(--ink);border:1px solid #cdbf9c;border-radius:8px;padding:11px 12px}
.row3.two{grid-template-columns:1fr 1fr}
.card[disabled]{opacity:.5;cursor:not-allowed}
.card[disabled]:hover{border-color:#2a3a63;background:var(--navy2)}
.card small{display:block;margin-top:6px;color:#cfd3e2}
.rad{display:flex;gap:10px;align-items:center;padding:8px 0;margin:0;cursor:pointer}
.rad input{width:18px;height:18px;accent-color:#d9b36c}
.fs{border:1px solid #2a3a63;border-radius:3px;padding:12px 16px;margin:0 0 14px}
.fs legend{color:var(--gold);padding:0 6px}
.tag.sim{background:#3a3014;color:#f0d896;margin:0 0 0 6px}
.ph{border:1px dashed #3a4c7a;border-radius:3px;padding:20px;min-height:140px;color:var(--mute);font-size:.9rem}
.cont{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:center}
.cont ul{margin:0;padding-left:18px}.cont li{margin-bottom:.4em}
.mail{background:#fffcf4;color:var(--ink);border-radius:3px;padding:20px;margin:12px 0;box-shadow:0 8px 22px rgba(0,0,0,.3);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem}
.mail .mh{font:.8rem "Nunito Sans",sans-serif;color:#5f6474;border-bottom:1px solid #e1d6bf;padding-bottom:8px;margin-bottom:10px}
.mail b{font-size:1.4rem;color:#0e192c;display:block;margin-bottom:6px}
.mail blockquote{margin:10px 0;padding-left:12px;border-left:3px solid #d9b36c;font-style:italic}
.ok{color:#b9e2b0}
.conf ul{text-align:left;max-width:60ch;margin:0 auto 24px;padding-left:18px}
@media(max-width:760px){.row3.two{grid-template-columns:1fr}.cont{grid-template-columns:1fr}}

/* Accueil ivoire · les styles du parcours restent indépendants */
body.home-ivory { background: #f5f0e6; color: #3a4052; color-scheme: light; }
.home-ivory #app > .wrap :is(h1,h2,h3) { color: #0e192c; }
.home-ivory #app > .wrap .hint { color: #555b68; }
.home-ivory .mom2::before { color: #8f6f2e; }
.home-ivory #app > .wrap .btn { background: #0e192c; color: #fffcf4; }
.home-ivory #app > .wrap .btn:hover { background: #1d2e55; }
.home-ivory .offer { background: #fffcf4; border: 1px solid #e1d6bf; }
.home-ivory .mcard { background: #eae0ce; border-color: #e1d6bf; }
.home-ivory #app > .wrap { padding-top: 24px; }
</style>
</head>

 <button class="brand" onclick="go(0)" aria-label="À Demi-Mot, accueil"><img id="hl" alt="À Demi-Mot"></button>

/* Le brouillon local reste disponible lorsque /api/letter est indisponible. */
async function aiLetter() {
  if (S.busy) return;
  const answers = S.ans.map((answer, i) => answer ? Q[i] + " → " + answer : "").filter(Boolean);
  if (!answers.length) return;

  const order = S;
  order.busy = true;
  paneUpdate();
  const length = {court:"35 à 55", moyen:"70 à 100", long:"130 à 180"}[order.len];
  const prompt = `Écris une lettre personnelle en français, au tutoiement, de ${length} mots.
Destinataire : ${order.name || "non précisé"}. Relation : ${order.rel || "non précisée"}. Occasion : ${order.occ || "non précisée"}.
Réponses : ${answers.join("\n")}
Reformule avec un ton chaleureux et sobre. Reste fidèle aux réponses, sans inventer de souvenirs. Réponds uniquement avec la lettre.`;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 9000);
  let suggestion = "";
  try {
    const response = await fetch("/api/letter", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt}),
      signal: controller.signal
    });
    if (response.ok) suggestion = (await response.json()).text?.trim() || "";
  } catch {
    // Le brouillon issu des réponses reste affiché.
  } finally {
    clearTimeout(timer);
  }
  if (S !== order) return;
  S.busy = false;
  if (suggestion) {
    if (S.edited || S.step !== 1 || S.mode !== "guide") S.pending = suggestion;
    else {
      S.letter = suggestion;
      S.src = "ai";
    }
  }
  if (S.view === 1 && S.step === 1 && S.mode === "guide") paneUpdate();
}

function drawModes(){const el=$("#modes");if(!el)return;const a=cur();
 if(!a){el.innerHTML="";return}
 if(!adOK(a)){el.innerHTML=`<h3>Mode de livraison</h3><p class="hint">Les modes disponibles s’affichent dès que l’adresse est complète (code postal à 5 chiffres).</p>`;return}
 const okS=inFR(a.cp),okH=inHand(a.cp);if(S.ship=="std"&&!okS||S.ship=="hand"&&!okH)S.ship=null;
 const d1=fmt(addBD(CFG.stdPrep+CFG.stdMin)),d2=fmt(addBD(CFG.stdPrep+CFG.stdMax));
 const c=(k,ok,t,b)=>`<button class="card ${S.ship==k?"sel":""}" ${ok?"":"disabled"} aria-pressed="${S.ship==k}" onclick="setShip('${k}')"><b>${t}</b>${b}</button>`;
 const who=S.dest=="buyer"?"vous":"la destinataire";
 el.innerHTML=`<h3>Mode de livraison</h3><div class="choice">${c("std",okS,"Livraison standard",`France métropolitaine · <strong>${eur(CFG.stdFee)}</strong><span class="tag sim">démo</span><small>Préparation ${CFG.stdPrep} jours ouvrés, transport ${CFG.stdMin} à ${CFG.stdMax} jours ouvrés. Livraison estimée entre le ${d1} et le ${d2}.</small>${okS?"":"<small>Indisponible : adresse hors France métropolitaine.</small>"}`)}${c("hand",okH,"Remise en main propre sur créneau",`Zones couvertes · <strong>${eur(CFG.handFee)}</strong><span class="tag sim">démo</span><small>Premier créneau à partir du ${fmt(addBD(CFG.handMin))}. Zone : ${esc(CFG.zonesLabel)}.</small>${okH?"":"<small>Indisponible : adresse hors zone couverte.</small>"}`)}</div>${!okS&&!okH?`<p class="err">Aucun mode de livraison n’est disponible pour cette adresse dans la démonstration.</p>`:""}
 ${S.ship=="hand"?`<fieldset class="fs"><legend>Créneau <span class="tag sim">créneaux fictifs</span></legend>${slots().map(x=>`<label class="rad"><input type="radio" name="slot" value="${esc(x.id)}" ${S.slot==x.id?"checked":""} onchange="S.slot=this.value;drawModes()">${esc(x.label)}</label>`).join("")}<label class="rad"><input type="radio" name="slot" value="contact" ${S.slot=="contact"?"checked":""} onchange="S.slot='contact';drawModes()">${S.dest=="buyer"?"Me contacter":"Contacter la destinataire"} pour convenir d’un créneau</label>${S.slot=="contact"?`<label for="ct">Téléphone ou e-mail de ${who} (pour convenir du créneau)</label><input type="text" id="ct" value="${esc(a.t)}" oninput="cur().t=this.value">`:""}</fieldset><label for="hm">Court message d’accompagnement (facultatif)</label><textarea id="hm" maxlength="200" style="min-height:70px" oninput="S.hmsg=this.value">${esc(S.hmsg)}</textarea><p class="hint">Transmis lors de la remise. Il est indépendant de l’e-mail surprise.</p>`:""}`}
/* e-mail surprise */
const sentences=()=>S.letter.split(/(?<=[.!?…])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>=12&&s.length<=140);
function surErr(){const u=S.sur;if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(u.email.trim()))return "Saisissez une adresse e-mail valide pour la destinataire.";if(!u.date)return "Choisissez la date d’envoi.";if(u.date<todayISO())return "La date d’envoi doit être aujourd’hui ou plus tard.";return ""}
const surRes=()=>S.sur.ok?`<p class="ok"><span class="tag sim">Simulation</span> E-mail programmé pour le ${fmtISO(S.sur.date)} à ${esc(S.sur.email)}. Aucun message réel n’est envoyé.</p>`:"";
function drawSur(){const el=$("#sur"),u=S.sur,ss=sentences();if(u.phrase&&!ss.includes(u.phrase))u.phrase="";
 el.innerHTML=`<h3 style="margin-top:26px">E-mail surprise (facultatif)</h3><div class="toggle"><input type="checkbox" id="su" ${u.on?"checked":""} onchange="S.sur.on=this.checked;S.sur.ok=false;drawSur()"><label for="su" style="margin:0">Programmer un e-mail surprise</label></div><p class="hint">Pour marquer l’occasion le jour choisi, si le coffret risque d’arriver plus tard. Indépendant du mode de livraison.</p>`+(u.on?`<div class="row3 two"><div><label for="se">E-mail de ${esc(S.name||"la destinataire")}</label><input type="email" id="se" value="${esc(u.email)}" oninput="surIn('email',this.value)"></div><div><label for="sd">Date d’envoi</label><input type="date" id="sd" min="${todayISO()}" value="${esc(u.date)}" oninput="surIn('date',this.value)"></div></div><label for="sp">Phrase de la lettre à citer (facultatif)</label><select id="sp" onchange="surIn('phrase',this.value)"><option value="">Aucune phrase</option>${ss.map(s=>`<option value="${esc(s)}" ${u.phrase==s?"selected":""}>${esc(s.length>70?s.slice(0,68)+"…":s)}</option>`).join("")}</select><div id="sprev"></div><button class="btn ghost sm" onclick="surSim()">Simuler la programmation</button><p class="err" id="serr"></p><div id="sres">${surRes()}</div>`:"");if(u.on)surPrev()}
function surIn(k,v){S.sur[k]=v;S.sur.ok=false;$("#sres").innerHTML="";surPrev()}
function surPrev(){const u=S.sur;$("#sprev").innerHTML=`<div class="mail"><div class="mh">De : À Demi-Mot · À : ${esc(u.email||"adresse de la destinataire")} · Envoi prévu : ${u.date?esc(fmtISO(u.date)):"date à choisir"}</div><b>Un cadeau t’attend</b><p>Quelqu’un a pensé à toi : un cadeau est en route.</p>${u.phrase?`<blockquote>« ${esc(u.phrase)} »</blockquote>`:""}<p style="margin:0">Tu découvriras la lettre complète et le bracelet à la réception du coffret.</p></div><p class="hint">Aperçu de l’e-mail.</p>`}
function surSim(){const e=surErr();$("#serr").textContent=e;S.sur.ok=!e;$("#sres").innerHTML=surRes()}

/* ---------- Étape 4 : vérification ---------- */
function shipHTML(){const a=cur();if(!a)return "";let h=`<b>${S.dest=="buyer"?"Livraison à mon adresse":"Envoi direct à "+esc(S.name||"la destinataire")}</b><br>${esc(a.n)}, ${esc(a.a)}, ${esc(a.cp)} ${esc(a.v)}<br>`;
 if(S.ship=="std")h+=`Livraison standard (France métropolitaine) · délai : préparation ${CFG.stdPrep} jours ouvrés + transport ${CFG.stdMin} à ${CFG.stdMax} jours ouvrés · estimée entre le ${fmt(addBD(CFG.stdPrep+CFG.stdMin))} et le ${fmt(addBD(CFG.stdPrep+CFG.stdMax))}`;
 else if(S.ship=="hand"){h+=`Remise en main propre · premier créneau à partir du ${fmt(addBD(CFG.handMin))}<br>`;h+=S.slot=="contact"?`Créneau à convenir : ${S.dest=="buyer"?"vous serez contacté·e":"la destinataire sera contactée"} (${esc(a.t)})`:`Créneau : ${esc(slotLabel(S.slot))}`;if(S.hmsg.trim())h+=`<br>Message d’accompagnement : « ${esc(S.hmsg.trim())} »`}
 return h}
function surHTML(){const u=S.sur;return u.on?`Envoi le ${fmtISO(u.date)} à ${esc(u.email)}${u.phrase?`<br>Extrait cité : « ${esc(u.phrase)} »`:""}<br><span class="hint">Programmation simulée.</span>`:"Aucun e-mail surprise."}
function totals(){return `<div class="tot"><span>Coffret « Un lien »</span><span>${eur(CFG.price)}</span></div><div class="tot"><span>${S.ship=="hand"?"Remise en main propre":"Livraison standard"} <span class="tag sim">démo</span></span><span>${eur(fee())}</span></div><div class="tot big"><span>Total TTC</span><span>${eur(total())}</span></div>`}
function s4(){const sec=(t,n,b)=>`<div class="sum"><div class="sumh"><h3 style="margin:0">${t}</h3><button class="btn ghost sm" onclick="goStep(${n})">Modifier</button></div>${b}</div>`;
 return `<h2>Vérifiez votre cadeau</h2>${sec("Lettre ("+STY[S.style].toLowerCase()+")",1,paper())}${sec("Présentation",2,`${S.music?musicCard():"<p class='hint'>Pas de carte d’écoute.</p>"}${contents()}`)}${sec("Livraison",3,`<p style="margin:0">${shipHTML()}</p><p style="margin:10px 0 0"><b>E-mail surprise</b><br>${surHTML()}</p>`)}<div class="sum">${totals()}</div>`}
function confirmV(){return `<div class="wrap panel conf" style="text-align:center;padding-top:60px"><h1>Commande simulée</h1><p class="lead">Référence de démonstration : <b>${S.ref}</b>. Aucun paiement ni envoi réel n’a eu lieu.</p><ul><li><span class="tag sim">Simulé</span> E-mail de confirmation envoyé à l’acheteur.</li><li><span class="tag sim">Simulé</span> Lien de suivi à l’expédition : exemple, non actif.</li><li><span class="tag sim">Simulé</span> Formulaire de contact en cas de question.</li><li>${S.sur.on?`<span class="tag sim">Simulé</span> E-mail surprise programmé : ${esc(fmtISO(S.sur.date))}, ${esc(S.sur.email)}.`:"Pas d’e-mail surprise."}</li></ul><div class="sum" style="text-align:left;max-width:640px;margin:0 auto 24px"><p>${shipHTML()}</p>${totals()}</div><button class="btn" onclick="reset()">Créer un autre cadeau</button></div>`}

/* ---------- Liaison : progression de la V1 vers la V2 ---------- */
function check(i){
 if(i==1){if(!S.mode)return "Choisissez comment écrire votre lettre.";if(S.mode=="guide"&&!gdone()&&!S.letter.trim())return "Répondez aux questions (ou passez-les) pour obtenir la proposition de lettre.";if(!S.letter.trim())return "Écrivez quelques mots avant de continuer."}
 if(i==2&&S.music){if(!S.song.trim())return "Ajoutez le lien de la chanson ou décochez la carte musicale.";if(!/^https?:\/\/\S+$/i.test(S.song.trim()))return "Le lien doit commencer par https://"}
 if(i==3){const a=cur();if(!a)return "Choisissez où livrer le coffret.";if(!adOK(a))return "Complétez l’adresse (code postal à 5 chiffres).";if(!S.ship||(S.ship=="std"&&!inFR(a.cp.trim()))||(S.ship=="hand"&&!inHand(a.cp)))return "Choisissez un mode de livraison disponible pour cette adresse.";
  if(S.ship=="hand"){if(!S.slot)return "Choisissez un créneau ou demandez à convenir d’un créneau.";if(S.slot=="contact"&&!a.t.trim())return "Indiquez un téléphone ou un e-mail pour convenir du créneau."}
  if(S.sur.on){const e=surErr();if(e)return e;S.sur.ok=true}}
 return ""}
function showErr(m){const e=$("#err");if(e){e.textContent=m;e.scrollIntoView({block:"center"})}}
function render(){const a=$("#app");
 document.body.classList.toggle("home-ivory",S.view===0);
 if(S.view==0)a.innerHTML=home();else if(S.done)a.innerHTML=confirmV();
 else{const b=[s1,s2,s3,s4][S.step-1]();
  a.innerHTML=`<div class="wrap">${stepper()}<div class="panel">${b}<p class="err" id="err" role="alert"></p><div class="nav"><button class="btn ghost" onclick="back()">${S.step==1?"Retour":"Précédent"}</button>${S.step<4?`<button class="btn" onclick="next()">Continuer</button>`:`<button class="btn" onclick="order()">Simuler la commande</button>`}</div></div></div>`;
  if(S.step==3){drawAddr();drawModes();drawSur()}
  const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight;if(S.step==1&&S.mode=="guide")paneUpdate()}}
function go(v){S.view=v;S.done=false;render();scrollTo(0,0)}
function start(){S.view=1;S.done=false;render();scrollTo(0,0)}
function goStep(n){for(let i=S.step;i<n;i++){const e=check(i);if(e){S.step=i;render();showErr(e);return}}S.step=n;render();scrollTo(0,0)}
function back(){if(S.step==1)go(0);else goStep(S.step-1)}
function next(){const e=check(S.step);if(e){showErr(e);return}goStep(S.step+1)}
function order(){const e=check(1)||check(2)||check(3);if(e){showErr(e);return}S.ref="DEMO-"+Math.floor(1000+Math.random()*9000);S.done=true;render();scrollTo(0,0)}
function reset(){S=fresh();render();scrollTo(0,0)}
render();$("#hl").src=LOGOH;$("#fl").src=LOGO;
</script>
</body>
</html>
